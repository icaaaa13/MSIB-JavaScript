<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tugas 6 RWD Bootstrap - Login</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container my-3">
    <!-- Header (Banner Carousel) -->
    <header class="row mb-3">
      <div class="col-12">
        <div id="headerCarousel" class="carousel slide rounded overflow-hidden shadow-sm" data-bs-ride="carousel">
          <div class="carousel-inner">
            <div class="carousel-item active">
              <img src="https://picsum.photos/1200/300?random=1" class="d-block w-100" alt="Banner 1">
            </div>
            <div class="carousel-item">
              <img src="https://picsum.photos/1200/300?random=2" class="d-block w-100" alt="Banner 2">
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Navigation Menu -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark rounded mb-3 shadow-sm">
      <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center" href="index.html">
          <i class="fa-solid fa-graduation-cap me-2 text-primary fs-3"></i>
          <strong>NF Academy</strong>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="study.html">MyStudy</a></li>
            <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
            <li class="nav-item"><a class="nav-link" href="datatables.html">Datatable</a></li>
            <li class="nav-item"><a class="nav-link btn btn-primary text-white ms-lg-2 px-3 active" href="login.html">Login</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main Content Area & Content (Sidebar) -->
    <div class="row mb-3">
      <!-- Content Area (Sidebar Link Eksternal) -->
      <aside class="col-md-4 col-lg-3 mb-3 mb-md-0">
        <div class="card shadow-sm h-100">
          <div class="card-header bg-primary text-white font-weight-bold">
            <i class="fa-solid fa-link me-1"></i> Link Eksternal
          </div>
          <div class="list-group list-group-flush sidebar-links">
            <a href="https://nfacademy.id" target="_blank" class="list-group-item list-group-item-action">NF Academy</a>
            <a href="https://nurulfikri.ac.id" target="_blank" class="list-group-item list-group-item-action">STT Nurul Fikri</a>
            <a href="https://getbootstrap.com" target="_blank" class="list-group-item list-group-item-action">Bootstrap Docs</a>
            <a href="https://github.com" target="_blank" class="list-group-item list-group-item-action">GitHub Workspace</a>
            <a href="https://siska.nurulfikri.ac.id/gate/menu" target="_blank" class="list-group-item list-group-item-action">Siska Nurul Fikri</a>
          </div>
        </div>
      </aside>

      <!-- Main Content Area (Form Login) -->
      <main class="col-md-8 col-lg-9">
        <div class="card shadow-sm h-100 p-4">
          <div class="row justify-content-center my-auto">
            <div class="col-md-8">
              <h3 class="card-title text-primary text-center mb-4">Form Login</h3>
              <form>
                <div class="mb-3">
                  <label for="email" class="form-label">Email Address</label>
                  <input type="email" class="form-control" id="email" placeholder="nama@domain.com" required>
                </div>
                <div class="mb-3">
                  <label for="password" class="form-label">Password</label>
                  <input type="password" class="form-control" id="password" required>
                </div>
                <div class="mb-3 form-check">
                  <input type="checkbox" class="form-check-input" id="remember">
                  <label class="form-check-label" for="remember">Ingat Saya</label>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Footer Area -->
    <footer class="row rounded p-3 text-center align-items-center shadow-sm">
      <div class="col-md-6 text-md-start mb-2 mb-md-0">
        <p class="mb-0"> Developed by <strong>Ica</strong> - STT Terpadu Nurul Fikri</p>
      </div>
      <div class="col-md-6 text-md-end">
        <a href="#" class="me-3"><i class="fa-brands fa-facebook"></i></a>
        <a href="#" class="me-3"><i class="fa-brands fa-instagram"></i></a>
        <a href="#" class="me-3"><i class="fa-brands fa-linkedin"></i></a>
        <a href="#"><i class="fa-brands fa-github"></i></a>
      </div>
    </footer>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
