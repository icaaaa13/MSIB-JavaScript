<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 2 - Data Pegawai dan Gaji</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background-color: #ffffff;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }
        thead {
            background-color: #3c97f1;
            color: #ffffff;
        }
        tfoot {
            background-color: #ecf0f1;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <marquee onmouseover="this.stop()" onmouseout="this.start()">
        <h2>DATA PEGAWAI DAN RINCIAN GAJI</h2>
    </marquee>
    <hr/>

    <script>
        // 1. DATA PEGAWAI
        let namaPegawai = "Dodi Prayodi";
        let umur = 25;
        let jabatan = "manajer";
        let status = "menikah";

        // 2. GAJI POKOK 
        let gapok = 0;
        let jbt = jabatan.toLowerCase();

        if (jbt === "manajer") {
            gapok = 15000000;
        } else if (jbt === "asisten manajer") {
            gapok = 10000000;
        } else if (jbt === "staff") {
            gapok = 5000000;
        } else {
            gapok = 0;
        }

        // 3. TUNJANGAN JABATAN (15% dari Gaji Pokok) & BPJS (10% dari Gaji Pokok)
        let tunjangJabatan = 0.15 * gapok;
        let bpjs = 0.10 * gapok;

        // 4. TUNJANGAN KELUARGA 
        let tunjangKeluarga = (status.toLowerCase() === "menikah") ? (0.20 * gapok) : 0;

        // 5. TOTAL GAJI
        let totalGaji = gapok + tunjangJabatan + bpjs + tunjangKeluarga;

        // Formatter Mata Uang Rupiah
        let formatRp = (angka) => "Rp " + angka.toLocaleString("id-ID");

        // 6. MENCETAK TABEL HTML (thead, tbody, tfoot)
        document.write("<table>");

        // Judul Kolom (thead)
        document.write("<thead>");
        document.write("<tr>");
        document.write("<th>Nama Pegawai</th>");
        document.write("<th>Umur</th>");
        document.write("<th>Jabatan</th>");
        document.write("<th>Status</th>");
        document.write("<th>Gaji Pokok</th>");
        document.write("<th>Tunjangan Jabatan (15%)</th>");
        document.write("<th>BPJS (10%)</th>");
        document.write("<th>Tunjangan Keluarga (20%)</th>");
        document.write("</tr>");
        document.write("</thead>");

        // Isi Data (tbody)
        document.write("<tbody>");
        document.write("<tr>");
        document.write("<td>" + namaPegawai + "</td>");
        document.write("<td>" + umur + " tahun</td>");
        document.write("<td>" + jabatan + "</td>");
        document.write("<td>" + status + "</td>");
        document.write("<td>" + formatRp(gapok) + "</td>");
        document.write("<td>" + formatRp(tunjangJabatan) + "</td>");
        document.write("<td>" + formatRp(bpjs) + "</td>");
        document.write("<td>" + formatRp(tunjangKeluarga) + "</td>");
        document.write("</tr>");
        document.write("</tbody>");

        // Total Gaji (tfoot)
        document.write("<tfoot>");
        document.write("<tr>");
        document.write("<td colspan='7' align='right'>TOTAL GAJI :</td>");
        document.write("<td>" + formatRp(totalGaji) + "</td>");
        document.write("</tr>");
        document.write("</tfoot>");

        document.write("</table>");
    </script>

</body>
</html>
